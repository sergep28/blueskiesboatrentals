services:
  - type: web
    name: blueskiesboatrentals
    runtime: node
    plan: starter
    # NOTE: do NOT add `npm run db:push` here — drizzle-kit push fails on this DB
    # (schema drift on pre-existing PKs, Postgres 42P16) and breaks the whole
    # deploy. Schema changes are provisioned idempotently at server startup by the
    # ensure*() functions (see src/db/ensure-*.ts).
    buildCommand: npm install && npm run build && npm run seed && npm run seed:properties
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: blueskies-db
          property: connectionString
      - key: APP_URL
        value: https://www.blueskiesboatrentals.com
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: FROM_EMAIL
        sync: false
      - key: GOOGLE_REVIEW_URL
        sync: false
      # Admin panel password. The server REFUSES TO BOOT in production without
      # this — an unset value would mean an unauthenticated admin API.
      - key: ADMIN_PASSWORD
        sync: false
      # AI Agent (Claude). Was set via the dashboard only; declared here so a
      # blueprint sync can't silently drop it and kill the agent.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Google service account (Drive photos + Search Console SEO data).
      - key: GOOGLE_SERVICE_ACCOUNT_KEY_JSON
        sync: false

databases:
  - name: blueskies-db
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: "18"
